name: Bug report
description: Report an issue after the public support channel is approved
labels: bug
body:
  - type: markdown
    attributes:
      value: "This is an unapproved local template, not a live support destination. Never attach raw diagnostics, databases, grants, active QR codes, private addresses or personal setups."
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows, browser and device (no personal identifiers)
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected behavior and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and event time
      description: "For freezes/FFB, distinguish observation from causality. No secrets or raw uploads."
